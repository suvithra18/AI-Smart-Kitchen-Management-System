{% extends 'base.html' %}

{% block content %}

<div class="card p-4 shadow border-0">

    <h2>
        ➖ Remove Stock
    </h2>

    <h4>
        {{ inventory.ingredient.name }}
    </h4>

    <form method="POST">

        {% csrf_token %}

        <input type="number"
               step="0.1"
               name="quantity"
               class="form-control mb-3"
               placeholder="Enter quantity">

        <button class="btn btn-danger">
            Remove Stock
        </button>

    </form>

</div>

{% endblock %}
