{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">
    🛒 Shopping List
</h1>

<div class="row">

    {% for item in shopping_items %}

        <div class="col-md-4 mb-4">

            <div class="card shadow border-0 p-4">

                <h3>
                    {{ item.ingredient.name }}
                </h3>

                <hr>

                <p>

                    Quantity Needed:

                    <b>
                        {{ item.quantity_needed }}
                        {{ item.ingredient.unit }}
                    </b>

                </p>

                <p>

                    Added On:

                    {{ item.created_at }}

                </p>

            </div>

        </div>

    {% empty %}

        <div class="alert alert-warning">

            No shopping items found

        </div>

    {% endfor %}

</div>

{% endblock %}
